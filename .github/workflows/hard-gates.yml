name: hard-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hard-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Regression tests
        run: python -m unittest discover tests -v

      - name: Every shipped skill meets the ship floor
        run: |
          status=0
          for skill in skills/*/; do
            echo "::group::$skill"
            python skills/skill-self-check/scripts/hard_gates.py "$skill" --pretty || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Bad fixture must still fail
        run: |
          if python skills/skill-self-check/scripts/hard_gates.py \
              skills/skill-self-check/examples/fixtures/bad-commit-helper > /dev/null; then
            echo "bad-commit-helper unexpectedly passed the ship floor"
            exit 1
          fi

      - name: Diagrams are reproducible from source
        run: |
          python branding/generate_diagrams.py
          git diff --exit-code -- assets/diagrams

  installer-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Bash installer copies all stable skills and rejects unsafe leaf
        if: runner.os == 'Linux'
        shell: bash
        run: |
          target="$(mktemp -d)"
          bash install.sh --project "$target"
          test -f "$target/.cursor/skills/skill-self-check/SKILL.md"
          test -f "$target/.cursor/skills/skill-ship-safety/SKILL.md"
          test -f "$target/.cursor/skills/agent-work-readiness/SKILL.md"
          test -f "$target/.cursor/skills/skill-growth-scorecard/SKILL.md"
          if bash install.sh --dest "$target/not-the-skill-name" --force; then
            echo "installer accepted an unsafe destination leaf"
            exit 1
          fi

      - name: PowerShell installer copies all stable skills and rejects unsafe leaf
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "skill-install-smoke"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          ./install.ps1 -Project $target
          if (-not (Test-Path (Join-Path $target ".cursor/skills/skill-self-check/SKILL.md"))) { throw "skill-self-check missing" }
          if (-not (Test-Path (Join-Path $target ".cursor/skills/skill-ship-safety/SKILL.md"))) { throw "skill-ship-safety missing" }
          if (-not (Test-Path (Join-Path $target ".cursor/skills/agent-work-readiness/SKILL.md"))) { throw "agent-work-readiness missing" }
          if (-not (Test-Path (Join-Path $target ".cursor/skills/skill-growth-scorecard/SKILL.md"))) { throw "skill-growth-scorecard missing" }
          try {
            ./install.ps1 -Dest (Join-Path $target "not-the-skill-name") -Force
            throw "installer accepted an unsafe destination leaf"
          }
          catch {
            if ($_.Exception.Message -eq "installer accepted an unsafe destination leaf") { throw }
          }
