<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 468"
     width="1100" height="468" role="img"
     aria-label="skill-self-check.app -&gt; docs -&gt; three-lights.svg">
  <defs>
    <style>
      .label { fill: #1A1A1A; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .label-sub { fill: #4A5568; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-tiny { fill: #6B7280; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-accent { fill: #0B3D91; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>
  <rect width="1100" height="468" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>

  <rect x="0" y="0" width="1100" height="48" fill="#FFFFFF"/>
  <rect x="0" y="0" width="4" height="48" fill="#0B3D91"/>
  <line x1="0" y1="48" x2="1100" y2="48" stroke="#0B3D91" stroke-width="1.5"/>
  <text x="20" y="29.0" fill="#4A5568" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">skill-self-check.app -&gt; docs -&gt; three-lights.svg</text>
  <rect x="1064" y="18.0" width="16" height="12" fill="#0B3D91"/>

  <g transform="translate(0, 48)">
<text x="550.0" y="36" text-anchor="middle" class="label-sub" font-size="15">自检看三盏灯 — 给老板的读法</text>
<rect x="40.0" y="85.0" width="300" height="150" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="190.0" y="111.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">BASIC</text>
<text x="190.0" y="137.0" text-anchor="middle" class="label" font-size="18">绿灯：能不能上手</text>
<text x="190.0" y="163.0" text-anchor="middle" class="label-tiny" font-size="13">结构过关</text>
<text x="190.0" y="181.0" text-anchor="middle" class="label-tiny" font-size="13">可以先真用</text>
<rect x="400.0" y="85.0" width="300" height="150" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="550.0" y="111.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">CONTRACT</text>
<text x="550.0" y="137.0" text-anchor="middle" class="label" font-size="18">黄灯：说清楚了吗</text>
<text x="550.0" y="163.0" text-anchor="middle" class="label-tiny" font-size="13">何时用 / 不用</text>
<text x="550.0" y="181.0" text-anchor="middle" class="label-tiny" font-size="13">检查轴 + 验收</text>
<rect x="760.0" y="85.0" width="300" height="150" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="910.0" y="111.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">KIT</text>
<text x="910.0" y="137.0" text-anchor="middle" class="label" font-size="18">蓝灯：配套齐了吗</text>
<text x="910.0" y="163.0" text-anchor="middle" class="label-tiny" font-size="13">资料 / 案例</text>
<text x="910.0" y="181.0" text-anchor="middle" class="label-tiny" font-size="13">落地记忆 / 脚本</text>
<line x1="340" y1="160" x2="390" y2="160" stroke="#D0D7E2" stroke-width="2"/><polygon points="400,160 388,155 388,165" fill="#0B3D91"/>
<line x1="700" y1="160" x2="750" y2="160" stroke="#D0D7E2" stroke-width="2"/><polygon points="760,160 748,155 748,165" fill="#0B3D91"/>
<text x="550.0" y="290" text-anchor="middle" class="label-tiny" font-size="13">绿灯不亮 → 先改，别推广</text>
<text x="550.0" y="312" text-anchor="middle" class="label-tiny" font-size="13">绿灯亮、黄/蓝暗 → 能用，但容易各做各的或不好交接</text>
<text x="550.0" y="334" text-anchor="middle" class="label-tiny" font-size="13">三盏都亮 → 可以放心推广</text>
<text x="550.0" y="356" text-anchor="middle" class="label-tiny" font-size="13">蓝灯 N/A 不算缺（声明不适用即可）</text>
    <text x="1080" y="404" text-anchor="end" class="label-tiny mono">05 · 三盏灯</text>
  </g>
</svg>
