<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 608"
     width="1480" height="608" role="img"
     aria-labelledby="workflow-prompt-audit-zh-title workflow-prompt-audit-zh-desc">
  <title id="workflow-prompt-audit-zh-title">模型调用拓扑 × 功能角色拓扑</title>
  <desc id="workflow-prompt-audit-zh-desc">流程图展示模型调用拓扑与功能角色拓扑的独立判断、角色合同和 Prompt 合成，以及独立于核心门禁的静态结果。</desc>
  <defs>
    <style>
      .label { fill: #1A1A1A; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .label-sub { fill: #4A5568; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-tiny { fill: #6B7280; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-accent { fill: #0B3D91; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>
  <rect width="1480" height="608" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>

  <rect x="0" y="0" width="1480" height="48" fill="#FFFFFF"/>
  <rect x="0" y="0" width="4" height="48" fill="#0B3D91"/>
  <line x1="0" y1="48" x2="1480" y2="48" stroke="#0B3D91" stroke-width="1.5"/>
  <text x="20" y="29.0" fill="#4A5568" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">skill-self-check.app -&gt; role -&gt; topology-audit.svg</text>
  <rect x="1444" y="18.0" width="16" height="12" fill="#0B3D91"/>

  <g transform="translate(0, 48)">
<text x="740.0" y="36" text-anchor="middle" class="label-sub" font-size="15">先判定模型调用拓扑，再判定功能角色拓扑；两个维度相互独立</text>
<line x1="208" y1="234.0" x2="242" y2="234.0" stroke="#D0D7E2" stroke-width="2"/><polygon points="252,234.0 240,229.0 240,239.0" fill="#0B3D91"/>
<line x1="476" y1="234.0" x2="506" y2="234.0" stroke="#D0D7E2" stroke-width="2"/><polygon points="516,234.0 504,229.0 504,239.0" fill="#0B3D91"/>
<line x1="740" y1="234.0" x2="770" y2="234.0" stroke="#D0D7E2" stroke-width="2"/><polygon points="780,234.0 768,229.0 768,239.0" fill="#0B3D91"/>
<line x1="1004" y1="234.0" x2="1066" y2="234.0" stroke="#D0D7E2" stroke-width="2"/><polygon points="1076,234.0 1064,229.0 1064,239.0" fill="#0B3D91"/>
<rect x="32" y="96" width="176" height="276" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="120.0" y="128" text-anchor="middle" class="label-accent mono" font-size="11" letter-spacing="0.08em">MANIFEST</text>
<text x="120.0" y="160" text-anchor="middle" class="label" font-size="17">运行证据</text>
<rect x="48" y="180" width="144" height="28" rx="2" fill="#F0F4FA" stroke="#D0D7E2" stroke-width="1"/>
<text x="120.0" y="200" text-anchor="middle" class="label-tiny mono" font-size="11">实际调用入口</text>
<rect x="48" y="220" width="144" height="28" rx="2" fill="#F0F4FA" stroke="#D0D7E2" stroke-width="1"/>
<text x="120.0" y="240" text-anchor="middle" class="label-tiny mono" font-size="11">Prompt / manifest</text>
<rect x="48" y="260" width="144" height="28" rx="2" fill="#F0F4FA" stroke="#D0D7E2" stroke-width="1"/>
<text x="120.0" y="280" text-anchor="middle" class="label-tiny mono" font-size="11">权限 + 交付边界</text>
<rect x="252" y="72" width="224" height="324" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="364.0" y="96" text-anchor="middle" class="label-tiny mono" font-size="10" letter-spacing="0.08em">维度 01</text>
<text x="364.0" y="120" text-anchor="middle" class="label" font-size="16">模型调用拓扑</text>
<line x1="252" y1="136" x2="476" y2="136" stroke="#D0D7E2" stroke-width="1"/>
<text x="268" y="156" class="label-accent mono" font-size="10" letter-spacing="0.06em">EVIDENCE</text>
<text x="268" y="176" class="label-tiny" font-size="12">实际模型调用入口</text>
<line x1="264" y1="188" x2="464" y2="188" stroke="#D0D7E2" stroke-width="1"/>
<text x="268" y="208" class="label-accent mono" font-size="10" letter-spacing="0.06em">MODE</text>
<text x="268" y="228" class="label-tiny" font-size="12">single_context / workflow_nodes</text>
<line x1="264" y1="240" x2="464" y2="240" stroke="#D0D7E2" stroke-width="1"/>
<text x="268" y="260" class="label-accent mono" font-size="10" letter-spacing="0.06em">RULE</text>
<text x="268" y="280" class="label-tiny" font-size="12">标题与步骤不等于调用</text>
<line x1="264" y1="292" x2="464" y2="292" stroke="#D0D7E2" stroke-width="1"/>
<text x="268" y="312" class="label-accent mono" font-size="10" letter-spacing="0.06em">OUTPUT</text>
<text x="268" y="332" class="label-tiny" font-size="12">runtime_mode</text>
<line x1="264" y1="344" x2="464" y2="344" stroke="#D0D7E2" stroke-width="1"/>
<text x="268" y="364" class="label-accent mono" font-size="10" letter-spacing="0.06em">BOUNDARY</text>
<text x="268" y="384" class="label-tiny" font-size="12">不虚构模型节点</text>
<rect x="516" y="72" width="224" height="324" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="628.0" y="96" text-anchor="middle" class="label-tiny mono" font-size="10" letter-spacing="0.08em">维度 02</text>
<text x="628.0" y="120" text-anchor="middle" class="label" font-size="16">功能角色拓扑</text>
<line x1="516" y1="136" x2="740" y2="136" stroke="#D0D7E2" stroke-width="1"/>
<text x="532" y="156" class="label-accent mono" font-size="10" letter-spacing="0.06em">EVIDENCE</text>
<text x="532" y="176" class="label-tiny" font-size="12">工作单元 + 权限边界</text>
<line x1="528" y1="188" x2="728" y2="188" stroke="#D0D7E2" stroke-width="1"/>
<text x="532" y="208" class="label-accent mono" font-size="10" letter-spacing="0.06em">MODE</text>
<text x="532" y="228" class="label-tiny" font-size="12">single_role / sequential_roles</text>
<line x1="528" y1="240" x2="728" y2="240" stroke="#D0D7E2" stroke-width="1"/>
<text x="532" y="260" class="label-accent mono" font-size="10" letter-spacing="0.06em">CHAIN</text>
<text x="532" y="280" class="label-tiny" font-size="12">entry_role + next</text>
<line x1="528" y1="292" x2="728" y2="292" stroke="#D0D7E2" stroke-width="1"/>
<text x="532" y="312" class="label-accent mono" font-size="10" letter-spacing="0.06em">OUTPUT</text>
<text x="532" y="332" class="label-tiny" font-size="12">role_count + roles</text>
<line x1="528" y1="344" x2="728" y2="344" stroke="#D0D7E2" stroke-width="1"/>
<text x="532" y="364" class="label-accent mono" font-size="10" letter-spacing="0.06em">BOUNDARY</text>
<text x="532" y="384" class="label-tiny" font-size="12">保持最少必要角色</text>
<rect x="780" y="72" width="224" height="324" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="892.0" y="96" text-anchor="middle" class="label-tiny mono" font-size="10" letter-spacing="0.08em">合成</text>
<text x="892.0" y="120" text-anchor="middle" class="label" font-size="16">角色 + Prompt</text>
<line x1="780" y1="136" x2="1004" y2="136" stroke="#D0D7E2" stroke-width="1"/>
<text x="796" y="156" class="label-accent mono" font-size="10" letter-spacing="0.06em">CONTRACT</text>
<text x="796" y="176" class="label-tiny" font-size="12">输入 + 权限 + 输出</text>
<line x1="792" y1="188" x2="992" y2="188" stroke="#D0D7E2" stroke-width="1"/>
<text x="796" y="208" class="label-accent mono" font-size="10" letter-spacing="0.06em">PROMPT</text>
<text x="796" y="228" class="label-tiny" font-size="12">十段角色提示词</text>
<line x1="792" y1="240" x2="992" y2="240" stroke="#D0D7E2" stroke-width="1"/>
<text x="796" y="260" class="label-accent mono" font-size="10" letter-spacing="0.06em">VERIFY</text>
<text x="796" y="280" class="label-tiny" font-size="12">验收 + 停止 + 交接</text>
<line x1="792" y1="292" x2="992" y2="292" stroke="#D0D7E2" stroke-width="1"/>
<text x="796" y="312" class="label-accent mono" font-size="10" letter-spacing="0.06em">OUTPUT</text>
<text x="796" y="332" class="label-tiny" font-size="12">JSON + paste-ready patch</text>
<line x1="792" y1="344" x2="992" y2="344" stroke="#D0D7E2" stroke-width="1"/>
<text x="796" y="364" class="label-accent mono" font-size="10" letter-spacing="0.06em">CLAIM</text>
<text x="796" y="384" class="label-tiny" font-size="12">静态审阅不证明提升</text>
<rect x="1076" y="96" width="372" height="276" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="1262.0" y="128" text-anchor="middle" class="label-accent mono" font-size="11" letter-spacing="0.08em">STATIC RESULT</text>
<text x="1262.0" y="160" text-anchor="middle" class="label" font-size="18">独立角色摘要</text>
<rect x="1094" y="192" width="78" height="32" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1133" y="213" text-anchor="middle" class="label-tiny mono" font-size="8.5">pass</text>
<rect x="1178" y="192" width="78" height="32" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1217" y="213" text-anchor="middle" class="label-tiny mono" font-size="8.5">needs_work</text>
<rect x="1262" y="192" width="78" height="32" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1301" y="213" text-anchor="middle" class="label-tiny mono" font-size="8.5">not_assessed</text>
<rect x="1346" y="192" width="78" height="32" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1385" y="213" text-anchor="middle" class="label-tiny mono" font-size="8.5">not_applicable</text>
<text x="1262.0" y="272" text-anchor="middle" class="label-tiny mono" font-size="12">runtime_mode · role_mode · role_count</text>
<text x="1262.0" y="300" text-anchor="middle" class="label-sub" font-size="12">静态 JSON · 不调用模型</text>
<rect x="40" y="424" width="1400" height="96" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="215" y="458" text-anchor="middle" class="label-accent mono" font-size="11" letter-spacing="0.08em">单上下文</text>
<text x="215" y="488" text-anchor="middle" class="label-tiny" font-size="12">顺序角色不等于多次调用</text>
<line x1="390" y1="440" x2="390" y2="504" stroke="#D0D7E2" stroke-width="1"/>
<text x="565" y="458" text-anchor="middle" class="label-accent mono" font-size="11" letter-spacing="0.08em">WORKFLOW</text>
<text x="565" y="488" text-anchor="middle" class="label-tiny" font-size="12">真实节点才逐节点分角色</text>
<line x1="740" y1="440" x2="740" y2="504" stroke="#D0D7E2" stroke-width="1"/>
<text x="915" y="458" text-anchor="middle" class="label-accent mono" font-size="11" letter-spacing="0.08em">角色链</text>
<text x="915" y="488" text-anchor="middle" class="label-tiny" font-size="12">唯一入口 · 连通 · 无环</text>
<line x1="1090" y1="440" x2="1090" y2="504" stroke="#D0D7E2" stroke-width="1"/>
<text x="1265" y="458" text-anchor="middle" class="label-accent mono" font-size="11" letter-spacing="0.08em">守边界</text>
<text x="1265" y="488" text-anchor="middle" class="label-tiny" font-size="12">不执行目标 · 不改门禁</text>
    <text x="1460" y="544" text-anchor="end" class="label-tiny mono">07 · 双维度角色审计</text>
  </g>
</svg>
