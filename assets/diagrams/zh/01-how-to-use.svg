<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 408"
     width="1480" height="408" role="img"
     aria-label="skill-self-check.app -&gt; docs -&gt; how-to-use.svg">
  <defs>
    <style>
      .label { fill: #1A1A1A; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .label-sub { fill: #4A5568; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-tiny { fill: #6B7280; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-accent { fill: #0B3D91; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>
  <rect width="1480" height="408" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>

  <rect x="0" y="0" width="1480" height="48" fill="#FFFFFF"/>
  <rect x="0" y="0" width="4" height="48" fill="#0B3D91"/>
  <line x1="0" y1="48" x2="1480" y2="48" stroke="#0B3D91" stroke-width="1.5"/>
  <text x="20" y="29.0" fill="#4A5568" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">skill-self-check.app -&gt; docs -&gt; how-to-use.svg</text>
  <rect x="1444" y="18.0" width="16" height="12" fill="#0B3D91"/>

  <g transform="translate(0, 48)">
<text x="740.0" y="36" text-anchor="middle" class="label-sub" font-size="15">一句话：像验货一样，验「AI 工作说明书」能不能用</text>
<line x1="150.7" y1="200" x2="1397.8" y2="200" stroke="#D0D7E2" stroke-width="2"/>
<circle cx="150.7" cy="200" r="8" fill="#0B3D91"/>
<rect x="30.7" y="90.0" width="240" height="120" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="150.7" y="116.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">第 1 步</text>
<text x="150.7" y="142.0" text-anchor="middle" class="label" font-size="18">写好说明书</text>
<text x="150.7" y="168.0" text-anchor="middle" class="label-tiny" font-size="13">把做事步骤写清楚</text>
<text x="150.7" y="186.0" text-anchor="middle" class="label-tiny" font-size="13">（也叫 Skill）</text>
<line x1="150.7" y1="192" x2="150.7" y2="210" stroke="#D0D7E2" stroke-width="1.4"/>
<circle cx="424.8" cy="200" r="8" fill="#0050B3"/>
<rect x="304.8" y="190.0" width="240" height="120" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="424.8" y="216.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">第 2 步</text>
<text x="424.8" y="242.0" text-anchor="middle" class="label" font-size="18">一键自检</text>
<text x="424.8" y="268.0" text-anchor="middle" class="label-tiny" font-size="13">电脑先打分</text>
<text x="424.8" y="286.0" text-anchor="middle" class="label-tiny" font-size="13">再给修改意见</text>
<line x1="424.8" y1="208" x2="424.8" y2="190" stroke="#D0D7E2" stroke-width="1.4"/>
<circle cx="698.9" cy="200" r="8" fill="#0B3D91"/>
<rect x="578.9" y="90.0" width="240" height="120" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="698.9" y="116.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">第 3 步</text>
<text x="698.9" y="142.0" text-anchor="middle" class="label" font-size="18">看三盏灯</text>
<text x="698.9" y="168.0" text-anchor="middle" class="label-tiny" font-size="13">能不能上手用</text>
<text x="698.9" y="186.0" text-anchor="middle" class="label-tiny" font-size="13">说清了吗</text>
<text x="698.9" y="204.0" text-anchor="middle" class="label-tiny" font-size="13">配套齐了吗</text>
<line x1="698.9" y1="192" x2="698.9" y2="210" stroke="#D0D7E2" stroke-width="1.4"/>
<circle cx="973.0" cy="200" r="8" fill="#0B3D91"/>
<rect x="853.0" y="190.0" width="240" height="120" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="973.0" y="216.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">第 4 步</text>
<text x="973.0" y="242.0" text-anchor="middle" class="label" font-size="18">改完再用</text>
<text x="973.0" y="268.0" text-anchor="middle" class="label-tiny" font-size="13">先过门槛再真用</text>
<text x="973.0" y="286.0" text-anchor="middle" class="label-tiny" font-size="13">边用边观察</text>
<line x1="973.0" y1="208" x2="973.0" y2="190" stroke="#D0D7E2" stroke-width="1.4"/>
<circle cx="1247.0" cy="200" r="8" fill="#0B3D91"/>
<rect x="1127.0" y="90.0" width="240" height="120" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1247.0" y="116.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">可选</text>
<text x="1247.0" y="142.0" text-anchor="middle" class="label" font-size="18">先访谈客户</text>
<text x="1247.0" y="168.0" text-anchor="middle" class="label-tiny" font-size="13">把事情问清楚</text>
<text x="1247.0" y="186.0" text-anchor="middle" class="label-tiny" font-size="13">再决定写哪些说明书</text>
<line x1="1247.0" y1="192" x2="1247.0" y2="210" stroke="#D0D7E2" stroke-width="1.4"/>
    <text x="1460" y="344" text-anchor="end" class="label-tiny mono">01 · 怎么用</text>
  </g>
</svg>
