<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 428"
     width="1100" height="428" role="img"
     aria-label="skill-self-check.app -&gt; docs -&gt; two-lights.svg">
  <defs>
    <style>
      .label { fill: #1A1A1A; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .label-sub { fill: #4A5568; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-tiny { fill: #6B7280; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .label-accent { fill: #0B3D91; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>
  <rect width="1100" height="428" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>

  <rect x="0" y="0" width="1100" height="48" fill="#FFFFFF"/>
  <rect x="0" y="0" width="4" height="48" fill="#0B3D91"/>
  <line x1="0" y1="48" x2="1100" y2="48" stroke="#0B3D91" stroke-width="1.5"/>
  <text x="20" y="29.0" fill="#4A5568" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">skill-self-check.app -&gt; docs -&gt; two-lights.svg</text>
  <rect x="1064" y="18.0" width="16" height="12" fill="#0B3D91"/>

  <g transform="translate(0, 48)">
<text x="550.0" y="36" text-anchor="middle" class="label-sub" font-size="15">自检只看两盏灯 — 给老板的读法</text>
<rect x="120.0" y="90.0" width="320" height="160" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="280.0" y="116.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">BASIC</text>
<text x="280.0" y="142.0" text-anchor="middle" class="label" font-size="18">绿灯：能不能上手</text>
<text x="280.0" y="168.0" text-anchor="middle" class="label-tiny" font-size="13">结构过关</text>
<text x="280.0" y="186.0" text-anchor="middle" class="label-tiny" font-size="13">可以先真用</text>
<text x="280.0" y="204.0" text-anchor="middle" class="label-tiny" font-size="13">边用边改细节</text>
<rect x="660.0" y="90.0" width="320" height="160" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="820.0" y="116.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">CONTRACT</text>
<text x="820.0" y="142.0" text-anchor="middle" class="label" font-size="18">黄灯：说清楚了吗</text>
<text x="820.0" y="168.0" text-anchor="middle" class="label-tiny" font-size="13">查什么写清楚了吗</text>
<text x="820.0" y="186.0" text-anchor="middle" class="label-tiny" font-size="13">什么时候用 / 不用</text>
<text x="820.0" y="204.0" text-anchor="middle" class="label-tiny" font-size="13">验收有没有证据</text>
<line x1="440" y1="170" x2="650" y2="170" stroke="#D0D7E2" stroke-width="2"/><polygon points="660,170 648,165 648,175" fill="#0B3D91"/>
<text x="550.0" y="300" text-anchor="middle" class="label-tiny" font-size="14">两盏都亮 → 放心推广</text>
<text x="550.0" y="322" text-anchor="middle" class="label-tiny" font-size="14">绿灯亮、黄灯暗 → 能用但容易各做各的</text>
<text x="550.0" y="344" text-anchor="middle" class="label-tiny" font-size="14">绿灯不亮 → 先改，别急着推广</text>
    <text x="1080" y="364" text-anchor="end" class="label-tiny mono">05 · 两盏灯</text>
  </g>
</svg>
