  <g transform="translate(0, 48)">
<text x="740.0" y="36" text-anchor="middle" class="label-sub" font-size="15">5W2H：跟客户谈话时，七问问清再动手（一次只问一句）</text>
<rect x="104.0" y="75.0" width="300" height="110" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="254.0" y="101.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">What 做什么</text>
<text x="254.0" y="127.0" text-anchor="middle" class="label" font-size="18">结果是什么？</text>
<text x="254.0" y="153.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「日常运营」</text>
<rect x="428.0" y="75.0" width="300" height="110" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="578.0" y="101.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">Why 为什么</text>
<text x="578.0" y="127.0" text-anchor="middle" class="label" font-size="18">为了哪个数字？</text>
<text x="578.0" y="153.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「领导要的」</text>
<rect x="752.0" y="75.0" width="300" height="110" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="902.0" y="101.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">Who 谁来做</text>
<text x="902.0" y="127.0" text-anchor="middle" class="label" font-size="18">谁动手谁审批？</text>
<text x="902.0" y="153.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「我们团队」</text>
<rect x="1076.0" y="75.0" width="300" height="110" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1226.0" y="101.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">When 何时</text>
<text x="1226.0" y="127.0" text-anchor="middle" class="label" font-size="18">什么时候触发？</text>
<text x="1226.0" y="153.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「有空就做」</text>
<rect x="236.0" y="225.0" width="320" height="110" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="396.0" y="251.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">Where 在哪</text>
<text x="396.0" y="277.0" text-anchor="middle" class="label" font-size="18">在哪个系统里？</text>
<text x="396.0" y="303.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「电脑上」</text>
<rect x="580.0" y="225.0" width="320" height="110" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="740.0" y="251.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">How 怎么做</text>
<text x="740.0" y="277.0" text-anchor="middle" class="label" font-size="18">步骤和例外？</text>
<text x="740.0" y="303.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「看着办」</text>
<rect x="924.0" y="225.0" width="320" height="110" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="1084.0" y="251.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">How much 多少</text>
<text x="1084.0" y="277.0" text-anchor="middle" class="label" font-size="18">量 / 钱 / 时效？</text>
<text x="1084.0" y="303.0" text-anchor="middle" class="label-tiny" font-size="13">别接受：「不少」</text>
<text x="740.0" y="355" text-anchor="middle" class="label-accent" font-size="14">问清 → 画流程 → 再决定写哪些 AI 说明书</text>
    <text x="1460" y="364" text-anchor="end" class="label-tiny mono">04 · 5W2H</text>
