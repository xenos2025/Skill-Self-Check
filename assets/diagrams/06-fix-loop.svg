<text x="200.0" y="86.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">1</text>
<text x="200.0" y="112.0" text-anchor="middle" class="label" font-size="18">Write Skill</text>
<text x="200.0" y="138.0" text-anchor="middle" class="label-tiny" font-size="13">Your usual drafting flow</text>
<line x1="320.0" y1="110" x2="338.0" y2="110" stroke="#D0D7E2" stroke-width="2"/><polygon points="348.0,110 336.0,105 336.0,115" fill="#0B3D91"/>
<rect x="348.0" y="60.0" width="240" height="100" rx="2" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="1"/>
<text x="468.0" y="86.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">2</text>
<text x="468.0" y="112.0" text-anchor="middle" class="label" font-size="18">Hand to AI / install</text>
<text x="468.0" y="138.0" text-anchor="middle" class="label-tiny" font-size="13">Paste the GitHub URL to your AI</text>
<line x1="588.0" y1="110" x2="606.0" y2="110" stroke="#D0D7E2" stroke-width="2"/><polygon points="616.0,110 604.0,105 604.0,115" fill="#0B3D91"/>
<rect x="616.0" y="60.0" width="240" height="100" rx="2" fill="#F0F4FA" stroke="#0B3D91" stroke-width="1.6"/>
<text x="736.0" y="86.0" text-anchor="middle" class="label-tiny" font-size="11" letter-spacing="0.08em">3</text>
<text x="736.0" y="112.0" text-anchor="middle" class="label" font-size="18">Run hard gates</text>
<text x="736.0" y="138.0" text-anchor="middle" class="label-tiny" font-size="13">python hard_gates.py …</text>
<line x1="856.0" y1="110" x2="874.0" y2="110" stroke="#D0D7E2" stroke-width="2"/><polygon points="884.0,110 872.0,105 872.0,115" fill="#0B3D91"/>
